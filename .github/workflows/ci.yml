name: Validate library and showcase
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:consumer
      - run: npm test
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test --config playwright.consumer.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/screenshots
            test-results
            consumer-test-results
